spring:
  datasource:
    url: jdbc:h2:mem:rosterguard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

roster:
  reconciliation:
    missing-threshold: 0.30
    batch-size: 1000
  outbox:
    polling-interval-ms: 500000 # disabled automatic poller during rapid unit tests unless explicitly invoked
    batch-size: 50
    max-retries: 3
  security:
    jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwt-expiration-ms: 86400000

logging:
  level:
    com.rosterguard: DEBUG
