server:
  port: 8080

spring:
  application:
    name: rosterguard
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rosterguard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

roster:
  reconciliation:
    missing-threshold: 0.30
    batch-size: 1000
  outbox:
    polling-interval-ms: 1000
    batch-size: 50
    max-retries: 5
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-ms: 86400000
    demo-password: ${ROSTER_DEMO_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: OPERATOR,ADMIN
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","thread":"%t","logger":"%c{1}","message":"%replace(%m){''\r?\n'', '' ''}"}%n'
